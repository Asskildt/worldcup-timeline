<svg id="arena-map" viewBox="0 0 500 650" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">
  <defs>
    <filter id="arena-map-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      :root { --map-sea:#04091a; --map-uk:#0a1030; --map-ie:#0d1a18; --map-stroke:#1a3070; }
      [data-theme="light"] {
        --map-sea:#c8d8f0;
        --map-uk:#bdd0eb;
        --map-ie:#c0d5c8;
        --map-stroke:#5878a8;
      }
      [data-theme="light"] .arena-circle-london { fill: #1a5db5; }
      [data-theme="light"] .arena-label-london  { fill: #1a5db5; }
      [data-theme="light"] .arena-circle-north-west { fill: #c03030; }
      [data-theme="light"] .arena-label-north-west  { fill: #c03030; }
      [data-theme="light"] .arena-circle-north-east { fill: #c06000; }
      [data-theme="light"] .arena-label-north-east  { fill: #c06000; }
      [data-theme="light"] .arena-circle-midlands { fill: #0a7a40; }
      [data-theme="light"] .arena-label-midlands  { fill: #0a7a40; }
      [data-theme="light"] .arena-circle-wales { fill: #a02020; }
      [data-theme="light"] .arena-label-wales  { fill: #a02020; }
      [data-theme="light"] .arena-circle-scotland { fill: #5522cc; }
      [data-theme="light"] .arena-label-scotland  { fill: #5522cc; }
      [data-theme="light"] .arena-circle-ireland { fill: #1a7a30; }
      [data-theme="light"] .arena-label-ireland  { fill: #1a7a30; }
      .arena-dot:hover circle { r: 10; opacity: 1; }
    </style>
  </defs>
