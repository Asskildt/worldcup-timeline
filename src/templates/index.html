<!DOCTYPE html>
<html lang="{{lang}}">
<head>
{{head}}
{{theme-init}}
</head>
<body>

<!-- Sticky header: kompakt, alltid synlig -->
<div class="site-header">
    <div class="header-top">
        <div class="header-left"></div>
        <div class="header-brand">
            <img src="favicon.svg" class="header-crest" alt="Logo">
            <span class="header-title">UEFA EM 2028</span>
            <span class="header-host-flags">
                <svg class="flag-svg header-host-flag" aria-hidden="true"><use href="#gb-eng"/></svg>
                <svg class="flag-svg header-host-flag" aria-hidden="true"><use href="#gb-sct"/></svg>
                <svg class="flag-svg header-host-flag" aria-hidden="true"><use href="#gb-wls"/></svg>
                <svg class="flag-svg header-host-flag" aria-hidden="true"><use href="#ie"/></svg>
            </span>
        </div>
        <div class="header-right">
            <button class="header-share-btn" onclick="shareApp()" aria-label="Del siden">
                <i class="bi bi-share"></i>
            </button>
        </div>
    </div>

    <!-- Info-rad: neste kamp + neste Norge-kamp -->
    <div class="header-info">
        <!-- Neste kamp (alltid, uavhengig av VM-start) -->
        <div class="next-match-row" id="next-match-row">
            <span class="next-match-info" id="next-match-info"></span>
            <span id="live-badge" class="live-badge" style="display:none">LIVE</span>
        </div>
        <!-- Neste Norge-kamp (kun når det er en annen kamp enn neste generelt) -->
        <div class="norway-next-row" id="norway-next-row" style="display:none">
            <img src="nff-crest.png" class="nff-crest-sm" alt="NFF">
            <span class="norway-next-info" id="norway-next-info"></span>
        </div>
    </div>
</div>

<div class="container">

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" id="tab-nl-groups" onclick="showTab('nl-groups',this)">
            <i class="bi bi-shield"></i> Nations League
        </button>
        <button class="tab" id="tab-nl-matches" onclick="showTab('nl-matches',this)">
            <i class="bi bi-calendar-event"></i> NL-kamper
        </button>
        <button class="tab" id="tab-qual-groups" onclick="showTab('qual-groups',this)">
            <i class="bi bi-trophy"></i> Kvalik
        </button>
        <button class="tab" id="tab-qual-matches" onclick="showTab('qual-matches',this)">
            <i class="bi bi-calendar3"></i> Kvalik-kamper
        </button>
        <div class="tab-more-wrap">
            <button class="tab tab-more-btn" id="tab-more" onclick="toggleMoreTabs()">
                <i class="bi bi-three-dots"></i> EM 2028
            </button>
            <div class="tab-more-menu" id="tab-more-menu" style="display:none">
                <button class="tab-more-item" onclick="showTab('timeline',document.getElementById('tab-more'));closeMoreTabs()">
                    <i class="bi bi-bar-chart-steps"></i> Tidslinje
                </button>
                <button class="tab-more-item" onclick="showTab('table',document.getElementById('tab-more'));closeMoreTabs()">
                    <i class="bi bi-list-ul"></i> Tabell
                </button>
                <button class="tab-more-item" onclick="showTab('groups',document.getElementById('tab-more'));closeMoreTabs()">
                    <i class="bi bi-grid-3x3-gap"></i> Grupper
                </button>
                <button class="tab-more-item" onclick="showTab('bracket',document.getElementById('tab-more'));closeMoreTabs()">
                    <i class="bi bi-diagram-3"></i> Sluttspill
                </button>
                <button class="tab-more-item" onclick="showTab('arenas',document.getElementById('tab-more'));closeMoreTabs()">
                    <i class="bi bi-geo-alt"></i> Arenaer
                </button>
            </div>
        </div>
        <button class="tab" onclick="showTab('stats',this)" style="display:none">
            <i class="bi bi-bar-chart"></i> Statistikk
        </button>
        <div class="tabs-status">
            <div class="tz-wrap">
                <button class="tz-toggle" onclick="toggleLangMenu()" id="lang-toggle" aria-expanded="false">
                    <span class="tz-label-text">NO</span>
                </button>
                <div class="tz-menu" id="lang-menu" style="display:none"></div>
            </div>
            <div class="tz-wrap">
                <button class="tz-toggle" onclick="toggleTZMenu()" id="tz-toggle" aria-expanded="false">
                    <i class="bi bi-clock"></i> <span id="tz-label">CEST</span>
                </button>
                <div class="tz-menu" id="tz-menu" style="display:none"></div>
            </div>
            <span id="fetch-status" class="fetch-status"></span>
        </div>
        <div class="tz-backdrop" id="tz-backdrop" style="display:none" onclick="closeTZMenu();closeLangMenu()"></div>
    </div>

    <!-- Nations League — Grupper -->
    <div id="view-nl-groups" class="tab-panel active">
        <div id="nl-groups"></div>
    </div>

    <!-- Nations League — Kamper -->
    <div id="view-nl-matches" class="tab-panel">
        <div id="nl-matches"></div>
    </div>

    <!-- Tidslinje / Rutenett — deler panel, bytter modus med transponer-knapp -->
    <div id="view-timeline" class="tab-panel">
        <!-- Horisontal tidslinje -->
        <div id="tl-mode" class="tl-mode-horizontal">
            <div class="tl-hint" id="tl-hint">
                <i class="bi bi-arrow-left-right"></i> <span id="tl-hint-text">Scroll horisontalt for å se alle kamper</span>
            </div>
            <div class="tl-axis-wrap" id="tl-axis-wrap">
                <div class="tl-axis-outer" id="tl-axis-outer"></div>
            </div>
            <div class="tl-wrap" id="tl-wrap">
                <div class="tl-inner" id="tl"></div>
            </div>
        </div>
        <!-- Vertikalt rutenett -->
        <div id="vg-mode" class="tl-mode-vertical" style="display:none">
            <div class="tl-hint" id="vg-hint">
                <i class="bi bi-arrow-left-right"></i> <span id="vg-hint-text">Scroll horisontalt for å se alle datoer</span>
            </div>
            <div id="vg-toolbar"></div>
            <div class="vg-outer">
                <div class="vg-axis-wrap" id="vg-axis-wrap"></div>
                <div class="vg-header-scroll-wrap" id="vg-header-scroll-wrap">
                    <div class="vg-header-row" id="vg-header-row"></div>
                </div>
            </div>
            <div class="vg-body-outer">
                <div class="vg-axis-body-wrap" id="vg-axis-body-wrap"></div>
                <div class="vg-wrap" id="vg-wrap">
                    <div class="vg-inner" id="vg"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabell -->
    <div id="view-table" class="tab-panel">
        <div id="tbl-toolbar"></div>
        <div class="tbl-wrap">
            <table class="schedule" id="tbl"></table>
        </div>
    </div>

    <!-- Grupper -->
    <div id="view-groups" class="tab-panel">
        <div class="groups-grid" id="groups"></div>
    </div>

    <!-- Bracket / Sluttspill -->
    <div id="view-bracket" class="tab-panel">
        <!-- Bygges av buildBracket() ved første besøk -->
    </div>

    <!-- Statistikk -->
    <div id="view-stats" class="tab-panel">
        <!-- Bygges av buildStats() ved første besøk -->
    </div>

    <!-- Arenaer -->
    <div id="view-arenas" class="tab-panel">
        <!-- Bygges av buildArenas() ved første besøk -->
    </div>

    <!-- Kvalifisering — Grupper -->
    <div id="view-qual-groups" class="tab-panel">
        <div id="qual-groups"></div>
    </div>

    <!-- Kvalifisering — Kamper -->
    <div id="view-qual-matches" class="tab-panel">
        <div id="qual-matches"></div>
    </div>



{{footer}}

</div>

<!-- Modal -->
<div id="modal" class="modal-backdrop" style="display:none" onclick="closeModal(event)">
    <div class="modal" role="dialog" aria-modal="true">
        <button class="modal-close" onclick="closeModal()" aria-label="Lukk">
            <i class="bi bi-x-lg"></i>
        </button>
        <div id="modal-content"></div>
    </div>
</div>

<!-- CRT-overlay (scanlines + vignette) — styres av body.crt-mode -->
<div class="crt-overlay" aria-hidden="true"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
